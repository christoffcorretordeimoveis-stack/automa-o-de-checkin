# Ambiente de desenvolvimento do app de automação de check-in.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Serviços:
#   db      - Postgres (infra, imagem pronta)
#   migrate - serviço único que cria o schema e insere as reservas de exemplo
#   api     - API Express (porta 8000), recarrega com `node --watch`
#   web     - Vite dev server (porta 3000, entrada pública do preview)
#
# Todo o código é montado a partir do checkout (bind mount) e as dependências são
# instaladas na inicialização do container, a partir do package-lock.json, em
# volumes nomeados — assim qualquer edição aparece sem rebuild de imagem.

name: checkin-app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: checkin
      POSTGRES_PASSWORD: checkin
      POSTGRES_DB: checkin
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin -d checkin -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Migração + seed: idempotente, roda uma vez a cada `up` e encerra.
  migrate:
    image: node:22
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://checkin:checkin@db:5432/checkin
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && node src/migrate.js"]

  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://checkin:checkin@db:5432/checkin
      PORT: "8000"
      BASE44_PREVIEW_MODE:
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:8000/api/health').then(r => {
          if (r.ok) process.exit(0);
          console.error('api: HTTP ' + r.status); process.exit(1);
          }).catch(e => { console.error('api: ' + e.message); process.exit(1) })"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
      # Passado pelo sandbox: hosts externos que o Vite dev server deve aceitar.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_PREVIEW_MODE:
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:3000/').then(r => {
          if (r.ok) process.exit(0);
          console.error('web: HTTP ' + r.status); process.exit(1);
          }).catch(e => { console.error('web: ' + e.message); process.exit(1) })"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 150s
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
